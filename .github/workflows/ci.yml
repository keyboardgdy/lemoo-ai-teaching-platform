name: W2

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: w2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true
      - uses: go-task/setup-task@v1
        with:
          version: 3.46.4
      - run: uv sync --project apps/cloud --locked
      - run: task docs:check repo:check schemas:check

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.2"
          python-version: "3.14"
          enable-cache: true
      - uses: go-task/setup-task@v1
        with:
          version: 3.46.4
      - run: uv lock --project apps/cloud --check
      - run: uv sync --project apps/cloud --locked
      - run: task backend:verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: go-task/setup-task@v1
        with:
          version: 3.46.4
      - run: pnpm install --frozen-lockfile
      - run: task frontend:verify

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --env-file .env.example config --quiet

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
