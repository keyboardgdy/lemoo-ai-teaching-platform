version: '3'

vars:
  CLOUD_PROJECT: apps/cloud
  WEB_PACKAGE: '@lemoo/web'

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  bootstrap:
    desc: Install pinned runtimes and locked project dependencies.
    cmds:
      - uv python install 3.14
      - uv sync --project {{.CLOUD_PROJECT}} --locked
      - pnpm install --frozen-lockfile
      - uv run --project {{.CLOUD_PROJECT}} python scripts/bootstrap.py

  infra:config:
    desc: Validate the local Compose model without starting containers.
    cmds:
      - docker compose --env-file .env.example config --quiet

  infra:up:
    desc: Start the local core dependency profile.
    preconditions:
      - sh: test -f .env
        msg: Run task bootstrap first to create the untracked local .env file.
    cmds:
      - docker compose --env-file .env --profile core up -d --wait

  infra:down:
    desc: Stop local services while preserving named data volumes.
    cmds:
      - docker compose --env-file .env --profile core down --remove-orphans

  dev:
    desc: Start the FastAPI and Vue development servers.
    deps: [dev:api, dev:web]

  dev:api:
    internal: true
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} uvicorn app.entrypoints.api:app --reload --host 127.0.0.1 --port 8000

  dev:web:
    internal: true
    cmds:
      - pnpm --filter {{.WEB_PACKAGE}} dev

  lint:
    desc: Run backend and frontend lint/format checks.
    deps: [backend:lint, frontend:lint]

  typecheck:
    desc: Run strict Python and Vue type checks.
    deps: [backend:typecheck, frontend:typecheck]

  test:
    desc: Run the W2 unit test suites.
    deps: [backend:test, frontend:test]

  build:
    desc: Build all W2 application artifacts.
    deps: [backend:build, frontend:build]

  backend:lint:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} ruff check apps/cloud scripts
      - uv run --project {{.CLOUD_PROJECT}} ruff format --check apps/cloud scripts

  backend:typecheck:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} pyright

  backend:test:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} pytest apps/cloud/tests --cov=apps/cloud/app --cov-report=term-missing --cov-fail-under=90

  backend:build:
    cmds:
      - uv build --project {{.CLOUD_PROJECT}}

  backend:verify:
    deps: [backend:lint, backend:typecheck, backend:test, backend:build]

  frontend:lint:
    cmds:
      - pnpm --filter {{.WEB_PACKAGE}} lint
      - pnpm --filter {{.WEB_PACKAGE}} format:check

  frontend:typecheck:
    cmds:
      - pnpm --filter {{.WEB_PACKAGE}} typecheck

  frontend:test:
    cmds:
      - pnpm --filter {{.WEB_PACKAGE}} test

  frontend:build:
    cmds:
      - pnpm --filter {{.WEB_PACKAGE}} build

  frontend:verify:
    cmds:
      - task: frontend:api:check
      - task: frontend:lint
      - task: frontend:typecheck
      - task: frontend:test
      - task: frontend:build

  frontend:api:check:
    cmds:
      - pnpm --filter {{.WEB_PACKAGE}} api:generate
      - git diff --exit-code -- apps/web/src/shared/api/generated

  docs:check:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} python scripts/check_docs.py

  repo:check:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} python scripts/check_repo.py

  openapi:generate:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} python scripts/export_openapi.py

  schemas:check:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} python scripts/check_schemas.py
      - uv run --project {{.CLOUD_PROJECT}} python scripts/export_openapi.py --check

  verify:
    desc: Execute all repository quality gates available for the current stage.
    deps: [lint, typecheck, test, test:protocol, build, frontend:api:check, docs:check, repo:check, schemas:check, infra:config]

  test:integration:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} python scripts/test_migrations.py
  test:protocol:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} pytest packages/protocol-schemas/tests -q
  test:e2e:
    cmds: [{ cmd: 'uv run --project {{.CLOUD_PROJECT}} python scripts/gate_not_ready.py Gate-3-Sim playwright-e2e' }]
  test:rls:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} python scripts/test_migrations.py
  test:ota:
    cmds: [{ cmd: 'uv run --project {{.CLOUD_PROJECT}} python scripts/gate_not_ready.py G2-OTA ota-tests' }]
  test:ai-actions:
    cmds: [{ cmd: 'uv run --project {{.CLOUD_PROJECT}} python scripts/gate_not_ready.py G2-AI ai-action-tests' }]
  device:facts:check:
    cmds: [{ cmd: 'uv run --project {{.CLOUD_PROJECT}} python scripts/gate_not_ready.py G1-Device physical-device-facts' }]
  ci:baseline:check:
    cmds: [{ cmd: 'uv run --project {{.CLOUD_PROJECT}} python scripts/gate_not_ready.py W7b4 full-ci-baseline' }]
  migrate:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} alembic -c apps/cloud/alembic.ini upgrade head
  database:setup:
    desc: Migrate and provision the local NOBYPASSRLS application role.
    cmds:
      - task: migrate
      - uv run --project {{.CLOUD_PROJECT}} python scripts/setup_database_role.py
  seed:
    desc: Upsert the six fixed PILOT-001 synthetic devices.
    cmds:
      - task: database:setup
      - uv run --project {{.CLOUD_PROJECT}} python scripts/seed_stage1a.py
  migrate:test:
    cmds:
      - uv run --project {{.CLOUD_PROJECT}} python scripts/test_migrations.py
  simulator:smoke:
    cmds: [{ cmd: 'uv run --project {{.CLOUD_PROJECT}} python scripts/gate_not_ready.py W8b simulator-smoke' }]
  image:verify:
    cmds: [{ cmd: 'uv run --project {{.CLOUD_PROJECT}} python scripts/gate_not_ready.py W7c image-verification' }]
