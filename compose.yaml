name: lemoo

services:
  postgresql:
    image: postgres:18.3-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: ${LEMOO_POSTGRES_USER:?set LEMOO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LEMOO_POSTGRES_PASSWORD:?set LEMOO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LEMOO_POSTGRES_DB:?set LEMOO_POSTGRES_DB}
    ports:
      - "127.0.0.1:${LEMOO_POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks: [core]

  redis:
    image: redis:8.2.1-alpine
    profiles: [core]
    environment:
      REDIS_PASSWORD: ${LEMOO_REDIS_PASSWORD:?set LEMOO_REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${LEMOO_REDIS_PASSWORD:?set LEMOO_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${LEMOO_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks: [core]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: [core]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${LEMOO_MINIO_ROOT_USER:?set LEMOO_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${LEMOO_MINIO_ROOT_PASSWORD:?set LEMOO_MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${LEMOO_MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${LEMOO_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks: [core]

  emqx:
    image: emqx/emqx:5.8.8
    profiles: [core]
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${LEMOO_EMQX_DASHBOARD_USER:?set LEMOO_EMQX_DASHBOARD_USER}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${LEMOO_EMQX_DASHBOARD_PASSWORD:?set LEMOO_EMQX_DASHBOARD_PASSWORD}
      EMQX_ALLOW_ANONYMOUS: "false"
    ports:
      - "127.0.0.1:${LEMOO_EMQX_DASHBOARD_PORT:-58083}:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: [CMD, /opt/emqx/bin/emqx, ctl, status]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks: [core]

networks:
  core:
    name: lemoo-core

volumes:
  postgresql-data:
  redis-data:
  minio-data:
  emqx-data:
  emqx-log:
